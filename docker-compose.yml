services:
  web:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: django-web
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: ems
      DB_USER: emsuser
      DB_PASSWORD: 12345678
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      sleep 30 &&
      python server/employeemanagement/manage.py migrate &&
      python server/employeemanagement/manage.py runserver 0.0.0.0:8000
      "

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: ems
      MYSQL_USER: emsuser
      MYSQL_PASSWORD: 12345678
      MYSQL_ROOT_PASSWORD: 12345678
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  react-app:
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client/ems:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./client/ems/.env
    depends_on:
      - web

volumes:
  mysql_data: